Pet:
  type: object
  properties:
    id:
      type: string
      example: "507f1f77bcf86cd799439012"
      description: ID único de la mascota
    name:
      type: string
      example: Max
      description: Nombre de la mascota
    species:
      type: string
      example: Perro
      description: Especie de la mascota (Perro, Gato, etc.)
    breed:
      type: string
      example: Golden Retriever
      description: Raza de la mascota
    age:
      type: integer
      minimum: 0
      example: 3
      description: Edad de la mascota en años
    status:
      type: string
      enum: [available, adopted]
      example: available
      description: Estado de adopción de la mascota
    owner:
      type: string
      nullable: true
      example: "507f1f77bcf86cd799439011"
      description: ID del dueño actual (null si está disponible)
    createdAt:
      type: string
      format: date-time
      example: "2026-03-08T10:30:00.000Z"
    updatedAt:
      type: string
      format: date-time
      example: "2026-03-08T10:30:00.000Z"

